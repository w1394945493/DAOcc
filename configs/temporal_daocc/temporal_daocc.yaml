#* 由 tools/temporal_daocc.py 显式加载完整单帧基础配置，原文件不修改。
base_config: ../nuscenes/occ3d/daocc_occ3d_nus_w_mask_custom.yaml
dataset_type: TemporalNuScenesDataset
#* range(start,stop,step)：默认前1关键帧；[1,4,1] 为前1、2、3帧。
# 改历史数量会改变融合卷积输入通道，旧时序 checkpoint 不能直接续训。
multi_adj_frame_id_cfg: [1, 2, 1]
model:
  type: TemporalDAOcc
  temporal:
    channels: 512
    num_history: ${len(range(*multi_adj_frame_id_cfg))}
    bounds: [-54.0, -54.0, 54.0, 54.0]
    # 不额外限制时间窗口；跨场景、非历史帧仍屏蔽。
    max_time_gap: null
data:
  train:
    dataset:
      temporal_mode: pair
      multi_adj_frame_id_cfg: ${multi_adj_frame_id_cfg}
      max_time_gap: null
  val:
    temporal_mode: pair
    multi_adj_frame_id_cfg: ${multi_adj_frame_id_cfg}
    max_time_gap: null
  test:
    temporal_mode: pair
    multi_adj_frame_id_cfg: ${multi_adj_frame_id_cfg}
    max_time_gap: null
