dataset_type: NuScenesDatasetOccupancy
dataset_root: data/nuscenes/
gt_paste_stop_epoch: -1
reduce_beams: 32
load_dim: 5
use_dim: 5
load_augmented: null
point_lidar_to_ego: false
occ_data_type: occ3d

point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
# point_cloud_coordinate: lidar
voxel_size: [0.1, 0.1, 0.2]
image_size: [256, 704]

augment2d:
  resize: [[0.38, 0.55], [0.48, 0.48], [-0.06, 0.11]]
  rotate: [-5.4, 5.4]
  gridmask:
    prob: 0.0
    fixed_prob: true

augment3d:
  scale: [0.9, 1.1]
  rotate: [-0.78539816, 0.78539816]
  translate: 0.5

object_classes:
  - car
  - truck
  - construction_vehicle
  - bus
  - trailer
  - barrier
  - motorcycle
  - bicycle
  - pedestrian
  - traffic_cone

input_modality:
  use_lidar: true
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

train_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadPointsFromMultiSweeps
    #* 当前样本是关键帧；历史输入来自其 LIDAR_TOP 的 prev 链，通常包含非关键帧。
    #* 训练时若候选历史帧多于9帧，将无放回随机选择9帧，并非固定取最近9帧。
    sweeps_num: 9
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    # 场景开头完全没有历史扫描时，重复当前关键帧点云进行填充。
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[2]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: ${augment2d.rotate}
    rand_flip: true
    is_train: true
  -
    type: GlobalRotScaleTrans
    resize_lim: ${augment3d.scale}
    rot_lim: ${augment3d.rotate}
    trans_lim: ${augment3d.translate}
    is_train: true
  -
    type: LoadOccGTFromFile
    data_type: ${occ_data_type}
  -
    type: RandomFlip3D
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectNameFilter
    classes: ${object_classes}
  # (10.29 检测GT迁移) 必须放在所有三维增强、翻转和 GT 范围/类别过滤之后，
  # (10.29 检测GT迁移) 保证预生成的 CenterHead 目标与最终送入模型的 GT 完全一致。
  -
    type: GenerateCenterHeadTargets
    tasks: ${model.heads.object.tasks}
    train_cfg: ${model.heads.object.train_cfg}
    norm_bbox: ${model.heads.object.norm_bbox}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: GridMask
    use_h: true
    use_w: true
    max_epoch: ${max_epochs}
    rotate: 1
    offset: false
    ratio: 0.5
    mode: 1
    prob: ${augment2d.gridmask.prob}
    fixed_prob: ${augment2d.gridmask.fixed_prob}
  -
    type: PointShuffle
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
      # (10.29 检测GT迁移) DataLoader worker 已生成的检测 heatmap、框回归目标、
      # (10.29 检测GT迁移) 中心索引和有效 mask；Collect3D 将其送入模型 kwargs。
      - object_targets
      - voxel_semantics
      - mask_lidar
      - mask_camera
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - camera_ego2global
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
      - occ_aug_matrix

test_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadPointsFromMultiSweeps
    #* 当前关键帧加9个历史 LiDAR sweep；历史 sweep 通常是非关键帧。
    # 测试数据集启用 test_mode 时固定取时间上最近的9帧，并将它们对齐到
    # 当前关键帧 LiDAR 坐标系后合并，作为一次模型推理的输入。
    sweeps_num: 9
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[2]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
  -
    type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  -
    type: LoadOccGTFromFile
    data_type: ${occ_data_type}
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
      - voxel_semantics
      - mask_lidar
      - mask_camera
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - camera_ego2global
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
      - occ_aug_matrix

data:
  samples_per_gpu: 4
  workers_per_gpu: 4
  train:
    # 训练集外层使用 CBGS 包装器。tools/train.py 以 recursive=True 加载配置，
    # 所以下级 occ3d/*.yaml 即使只覆盖 train.dataset.ann_file，也会保留此设置。
    # CBGS 根据一帧中出现的 3D 检测框类别重采样“场景”，用于缓解检测类别长尾；
    # 它不统计或直接平衡 occupancy 的 18 个体素语义类别。
    # val/test 没有套 CBGSDataset，因此验证和测试仍按原始数据顺序与长度执行。
    type: CBGSDataset
    dataset:
      # 被 CBGS 包装的真实数据集。外层负责索引重采样，内层负责读取样本和流水线。
      type: ${dataset_type}
      dataset_root: ${dataset_root}
      ann_file: ${dataset_root + "nuscenes_infos_train_w_3occ.pkl"}
      pipeline: ${train_pipeline}
      object_classes: ${object_classes}
      modality: ${input_modality}
      test_mode: false
      use_valid_flag: true
      box_type_3d: LiDAR
      data_type: ${occ_data_type}
  val:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${dataset_root + "nuscenes_infos_val_w_3occ.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    test_mode: true
    box_type_3d: LiDAR
    data_type: ${occ_data_type}
  test:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${dataset_root + "nuscenes_infos_val_w_3occ.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    test_mode: true
    box_type_3d: LiDAR
    data_type: ${occ_data_type}

evaluation:
  interval: 1
  pipeline: ${test_pipeline}

