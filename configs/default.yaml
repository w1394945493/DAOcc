seed: 0
deterministic: false
max_keep_ckpt: 1

checkpoint_config:
  interval: 1
  max_keep_ckpts: ${max_keep_ckpt}

log_config:
  interval: 50
  hooks:
    -
      type: TextLoggerHook
    -
      type: TensorboardLoggerHook

load_from: null
resume_from: null

cudnn_benchmark: false
# 精度总开关（顶层配置）：这里的 fp16 表示 FP16 + FP32 混合精度，不是全模型纯 FP16。
# 1. 混合精度：保留下方字典；训练时由 MMCV FP16 Hook 配合模型装饰器管理精度。
# 2. FP32：将整个 fp16 配置块替换为 fp16: null；命令行也可追加 --fp16 None。
#    不要写 fp16: false 或只删本文件的配置：训练判断的是是否为 None，且配置可能继承。
# 3. 当前入口没有提供纯 FP16 或 BF16 训练开关，不要用 model.half() 代替混合精度。
# 命令行覆盖优先于 YAML；最终生效值可在运行目录 configs.yaml 和启动日志中查看。
fp16:
  # 梯度缩放：反向传播前放大 loss，更新前还原梯度，缓解 FP16 梯度下溢。
  # 此处传字典使用动态缩放；growth_interval 表示连续无溢出多少步后增大 scale。
  # 若反向频繁溢出，可在此添加 init_scale: 256.0；不能修复前向已出现的 NaN。
  # 注意：它与 model.loss_scale（object/occ 等任务的损失权重）不是同一参数。
  loss_scale: 
    growth_interval: 2000 # 其余参数采用pytorch默认值： init_scale: 65536.0；backoff_factor: 0.5；growth_factor: 2.0

max_epochs: 20
runner:
  type: CustomEpochBasedRunner
  max_epochs: ${max_epochs}

custom_hooks:
  type: MEGVIIEMAHook
  init_updates: 10560
  priority: NORMAL
  max_keep_ckpt: ${max_keep_ckpt}

